name: Build

on:
  workflow_call:
    inputs:
      publish:
        description: Push the tested images and publish a multi-platform manifest
        type: boolean
        required: false
        default: false

jobs:
  container:
    strategy:
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set container image name
        run: echo "CONTAINER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build native ${{ matrix.architecture }} image
        run: |
          docker build \
            --platform ${{ matrix.platform }} \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag stockfish-gpt:test \
            .
      - name: Smoke test image and packaged application
        run: |
          test_port=18000
          container_id=$(docker run --detach \
            --env "PORT=$test_port" \
            --publish "$test_port:$test_port" \
            --health-interval 1s \
            --health-start-period 0s \
            stockfish-gpt:test)
          trap 'docker rm --force "$container_id"' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:$test_port/health"
          for _ in $(seq 1 20); do
            health_status=$(docker inspect \
              --format '{{.State.Health.Status}}' "$container_id")
            test "$health_status" = "healthy" && break
            sleep 1
          done
          test "$health_status" = "healthy"
          docker exec "$container_id" python -c \
            "from pathlib import Path; from mcp_app.main import WIDGET_FILENAME; assert (Path('/app/widget') / WIDGET_FILENAME).read_text().startswith('<!doctype html>')"
          printf 'uci\nquit\n' | docker exec --interactive "$container_id" stockfish \
            | grep 'Stockfish'
          test "$(docker exec "$container_id" id --user)" = "10001"
          test "$(docker exec "$container_id" sh -c \
            'test -x /usr/local/bin/stockfish &&
             test ! -e /usr/games/stockfish &&
             test -s /usr/share/doc/stockfish/COPYING &&
             test -s /usr/share/doc/stockfish/VERSION &&
             test -s /usr/share/doc/stockfish/SOURCE &&
             test -s /app/widget/index.html &&
             test ! -e /app/widget/src &&
             test ! -e /app/widget/package.json &&
             test ! -e /app/src &&
             echo clean')" = "clean"
          test "$(docker image inspect stockfish-gpt:test --format '{{.Architecture}}')" \
            = "${{ matrix.architecture }}"
      - name: Log in to GHCR
        if: >-
          inputs.publish &&
          github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: >-
          inputs.publish &&
          github.ref_name == github.event.repository.default_branch
        run: |
          architecture_image="${CONTAINER_IMAGE}:sha-${GITHUB_SHA}-${{ matrix.architecture }}"
          docker tag stockfish-gpt:test "$architecture_image"
          docker push "$architecture_image"

  publish-container:
    if: >-
      inputs.publish &&
      github.ref_name == github.event.repository.default_branch
    needs: container
    runs-on: ubuntu-24.04
    concurrency:
      group: rolling-container-${{ github.repository }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set container image name
        run: echo "CONTAINER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create rolling multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag "${CONTAINER_IMAGE}:latest" \
            --tag "${CONTAINER_IMAGE}:sha-${GITHUB_SHA}" \
            "${CONTAINER_IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${CONTAINER_IMAGE}:sha-${GITHUB_SHA}-arm64"
      - name: Verify and smoke test published image
        run: |
          docker manifest inspect "${CONTAINER_IMAGE}:sha-${GITHUB_SHA}" \
            | tee /tmp/stockfish-gpt-manifest.txt
          grep '"architecture": "amd64"' /tmp/stockfish-gpt-manifest.txt
          grep '"architecture": "arm64"' /tmp/stockfish-gpt-manifest.txt
          docker pull "${CONTAINER_IMAGE}:sha-${GITHUB_SHA}"
          test_port=18000
          container_id=$(docker run --detach \
            --env "PORT=$test_port" \
            --publish "$test_port:$test_port" \
            --health-interval 1s \
            --health-start-period 0s \
            "${CONTAINER_IMAGE}:sha-${GITHUB_SHA}")
          trap 'docker rm --force "$container_id"' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:$test_port/health"
          for _ in $(seq 1 20); do
            health_status=$(docker inspect \
              --format '{{.State.Health.Status}}' "$container_id")
            test "$health_status" = "healthy" && break
            sleep 1
          done
          test "$health_status" = "healthy"
          docker exec "$container_id" python -c \
            "from pathlib import Path; from mcp_app.main import WIDGET_FILENAME; assert (Path('/app/widget') / WIDGET_FILENAME).read_text().startswith('<!doctype html>')"
          printf 'uci\nquit\n' | docker exec --interactive "$container_id" stockfish \
            | grep 'Stockfish'
          test "$(docker exec "$container_id" sh -c \
            'test -x /usr/local/bin/stockfish &&
             test ! -e /usr/games/stockfish &&
             test -s /usr/share/doc/stockfish/COPYING &&
             test -s /usr/share/doc/stockfish/VERSION &&
             test -s /usr/share/doc/stockfish/SOURCE &&
             test -s /app/widget/index.html &&
             echo clean')" = "clean"
