name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/_validate.yml

  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      publish: false
