name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/_validate.yml

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      publish: true
