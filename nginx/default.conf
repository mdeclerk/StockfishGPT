# Ingress for the StockfishGPT MCP app.

upstream mcp_app {
    zone mcp_app 64k;
    least_conn;
    server mcp-app:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $host $mcp_global {
    default "all";
}

limit_conn_zone $mcp_global zone=mcp_inflight:1m;

log_format mcp '$remote_addr "$request" $status '
               'upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log mcp;
    client_max_body_size 256k;

    location /mcp {
        limit_conn mcp_inflight 12;
        limit_conn_status 429;

        proxy_pass http://mcp_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://mcp_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        return 404;
    }
}
